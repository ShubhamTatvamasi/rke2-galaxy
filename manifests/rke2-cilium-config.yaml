---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-cilium
  namespace: kube-system
spec:
  valuesContent: |-
    MTU: 1300
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 6443
    bgpControlPlane:
      enabled: true
    l2announcements:
      enabled: true
    k8sClientRateLimit:
      qps: 20
      burst: 40
    operator:
      replicas: 1
