---
- name: Deploy RKE2
  hosts: masters
  become: yes
  pre_tasks:
    - name: Write clean resolv.conf for kubelet
      copy:
        src: files/rke2-resolv.conf
        dest: /etc/rke2-resolv.conf
        mode: "0644"
    - name: Load kernel modules required by sysctl tuning
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter
        - nf_conntrack
    - name: Write sysctl tuning for RKE2
      copy:
        src: files/90-rke2.conf
        dest: /etc/sysctl.d/90-rke2.conf
        mode: "0644"
      notify: Apply sysctl
  roles:
    - role: lablabs.rke2
  handlers:
    - name: Apply sysctl
      command: sysctl --system
  vars:
    rke2_version: v1.36.4+rke2r1
    rke2_ha_mode: true
    rke2_ha_mode_keepalived: false
    rke2_ha_mode_kubevip: false
    rke2_api_ip: 10.10.153.255
    rke2_token: "changeme-shared-cluster-token"
    rke2_download_kubeconf: true
    rke2_download_kubeconf_path: ~/.kube
    rke2_ingress_controller: none
    rke2_custom_manifests:
      - manifests/rke2-canal-config.yaml
    rke2_kubelet_arg:
      - "max-pods=250"
      - "config=/etc/rancher/rke2/kubelet-config.yaml"
    rke2_kubelet_config:
      resolvConf: /etc/rke2-resolv.conf
