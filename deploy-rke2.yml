---
- name: Deploy RKE2
  hosts: masters
  become: yes
  roles:
    - role: lablabs.rke2
  vars:
    rke2_version: v1.36.2+rke2r1
    rke2_download_kubeconf: true
    rke2_download_kubeconf_path: ~/.kube
    rke2_ingress_controller: none
    rke2_custom_manifests:
      - manifests/rke2-canal-config.yaml
